{% extends '/adminpages/admin_nav.html' %}

{% block css3 %}<link rel='stylesheet' href="{{ url_for('static', filename='/css/admin/edit_trek.css') }}">{% endblock %}

{% block title %}Edit {{ trek.trek_name }}{% endblock %}

{% block main_content %}

<div id='wrapper'>
    <h1>Add New Trek</h1>
    <form action="{{ url_for('edit_trek', trek_id=trek.trek_id) }}" method='post'>
        
        <div class='half_form'>

            <label for="trek_name">Trek Name</label>
            <input type="text" id="trek_name" name="trek_name" placeholder="Enter Trek Name" value="{{trek.trek_name}}" required>

            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="Enter Location" value="{{trek.location}}" required>

            <label for="difficulty">Difficulty</label>
            <select name="difficulty" id="difficulty" required>
                <option value="Easy" {{ 'selected' if trek.difficulty == 'Easy' else '' }}>Easy</option>
                <option value="Moderate" {{ 'selected' if trek.difficulty == 'Moderate' else '' }}>Moderate</option>
                <option value="Hard" {{ 'selected' if trek.difficulty == 'Hard' else '' }}>Hard</option>
            </select>

            <label for="duration">Duration (Days)</label>
            <input type="number" id="duration" name="duration" placeholder="Enter Duration" value="{{trek.duration}}" required>

            <label for="slots">Total Slot</label>
            <input type="number" id="slot" name="slot" placeholder="Enter total slot" value="{{trek.total_slots}}" required>

            

        </div>
        <div class='half_form'>
            
            <label for="s_date">Start Date</label>
            <input type="date" id="s_date" name="s_date" placeholder="Enter starting date" value="{{trek.start_date}}" required>

            <label for="e_date">End Date</label>
            <input type="date" id="e_date" name="e_date" placeholder="Enter ending date" value="{{trek.end_date}}" required>

            <label for="b_date">Last Booking Date</label>
            <input type="date" id="b_date" name="b_date" placeholder="Enter ending date" value="{{trek.last_booking_date}}">

            <label for="staff">Assigned Staff</label>
            <select name="staff" id="staff" required>
                {% for staff in staffs %}
                <option value="{{ staff.staff_id }}" {{ 'selected' if trek.assigned_staff_id == "staff.staff_id" else '' }}>{{ staff.name }}</option>
                {% endfor %}
            </select>

            <label for="">Status</label>
            <select name="status" id="status" required>
                <option value="Pending" {{ 'selected' if trek.status=='pending' else '' }}>Pending</option>
                <option value="Approved" {{ 'selected' if trek.status=='approved' else '' }}>Approved</option>
                <option value="Open" {{ 'selected' if trek.status=='open' else '' }}>Open</option>
                <option value="Closed" {{ 'selected' if trek.status=='closed' else '' }}>Closed</option>
                <option value="Completed" {{ 'selected' if trek.status=='completed' else '' }}>Completed</option>
            </select>

            <label for="description">Enter your paragraph:</label>
            <textarea id="description" name="description" rows="5" cols="40" placeholder="Enter description">{{ trek.description }}</textarea>



            <input type="submit" id="submit-btn" value="submit">
        </div>
        
        
    </form>
</div>

{% endblock %}
