{% extends 'base.html' %}
{% block css %}<link rel="stylesheet" href="{{ url_for('static', filename='/css/register.css') }}">{% endblock %}
{% block title %}Register{% endblock %}

{% block content %}
    <div id="register-page-wrapper">
            <div id="register-box">
                <div id="heading">Create Your Account</div>
                <div id="message">Join the Trekking Management Application</div><br><br>


                <form action="/register" method="post">
                
                <div class="fields">

                    <div class="field">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="name" placeholder="Full Name" required>
                    </div>
                    
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" placeholder="Email Id" required>
                    </div>
                    
                </div>
                
                <div class="fields">

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>
                    

                    <div class="field">
                        <label for="phone">Phone No.(Preferable Whats App)</label>
                        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="Phone No.(Preferable Whats App)" required>
                    </div>
                        
                </div>


                <div id="role-field">
                    <label for="role">Role:</label>
                    <select name="role" id="role" required>
                        <option value="trekker">User(Trekker)</option>
                        <option value="trek-staff">Trek Staff</option>    
                    </select>
                </div>
                
                

                <input type="submit" id="submit-btn" value="Register">
                </form>
                <div id="login-prompt">Already have an account? <a href="{{ url_for('login') }}">Login Here</a></div>
            </div>
        </div>
{% endblock %}
